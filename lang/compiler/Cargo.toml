[package]
name = "lang-compiler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Parses, type-checks and bounds an expression against its interface, and emits bytecode. Runs off-device (natively and as WASM)."

[lib]
name = "compiler"

[[bin]]
name = "langc"
path = "src/main.rs"

[dependencies]
bytecode = { package = "lang-bytecode", path = "../bytecode" }
vm = { package = "lang-vm", path = "../vm" }
serde_json = "1"
sha2 = "0.10"
