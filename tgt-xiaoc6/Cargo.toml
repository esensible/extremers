[package]
name = "xiaoc6"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
# The app; src/bin/ holds the provision and dump tools (see README.md), so
# a plain `cargo run` needs telling which binary to flash.
default-run = "xiaoc6"

[dependencies]
# Common crate for shared code; it logs through defmt here
common = { path = "../common", features = ["defmt"] }

#
# Logging: defmt over RTT, read with probe-rs
#
defmt = "1.0"
rtt-target = { version = "0.6", features = ["defmt"] }

#
# esp32
#
esp-hal = { version = "1.2", features = ["defmt", "unstable"] }
esp-rtos = { version = "0.4", features = ["esp-radio", "embassy", "defmt"] }
esp-radio = { version = "1.0.0-beta.1", features = ["wifi", "defmt", "unstable"] }
# panics and backtraces go to defmt/RTT like everything else
esp-backtrace = { version = "0.20", features = ["panic-handler", "defmt"] }
esp-alloc = { version = "0.11" }
esp-bootloader-esp-idf = { version = "0.6" }

#
# Persistent settings (src/storage.rs): esp-storage is the internal SPI
# flash as NorFlash, embassy-embedded-hal adapts it to the async traits
# sequential-storage's map wants, and the data lives in the `settings`
# partition of partitions.csv, found at boot from the partition table.
# esp-storage 0.10 is the one esp-bootloader-esp-idf 0.6 reads the table
# with, so they share one FlashStorage type.
#
esp-storage = { version = "0.10", features = ["embedded-storage"] }
embassy-embedded-hal = "0.6"
sequential-storage = { version = "8.0", features = ["defmt"] }
embedded-storage = "0.3.2"
embedded-storage-async = "0.4"
embassy-sync = { workspace = true }

#
# Embassy
#
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-net = { workspace = true, features = [
    "tcp",
    "udp",
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
] }

#
# Networking
#
edge-nal = { workspace = true }
edge-nal-embassy = { workspace = true, features = ["proto-ipv4", "medium-ethernet", "tcp", "udp"] }
edge-dhcp = { workspace = true }
edge-captive = { workspace = true }

static_cell = { workspace = true }

# AtomicU64 (used by common) on riscv32imac needs emulation
portable-atomic = { workspace = true, features = ["critical-section"] }

extreme-traits = { path = "../extreme-traits/" }
extreme-race = { path = "../extreme-race/" }
extreme-tune = { path = "../extreme-tune/" }

[features]
default = ["esp32c6"]
esp32c6 = [
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
    "esp-radio/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-alloc/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-storage/esp32c6",
]
