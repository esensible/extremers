[package]
name = "xiaoc6"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
# The app; src/bin/ holds the provision and dump tools (see README.md), so
# a plain `cargo run` needs telling which binary to flash.
default-run = "xiaoc6"

[dependencies]
# Common crate for shared code; it logs through defmt here
common = { path = "../common", features = ["defmt", "ble"] }

#
# Logging: defmt over RTT, read with probe-rs
#
defmt = "1.0"
rtt-target = { version = "0.6", features = ["defmt"] }

#
# esp32
#
esp-hal = { version = "1.2", features = ["defmt", "unstable"] }
esp-rtos = { version = "0.4", features = ["esp-radio", "embassy", "defmt"] }
esp-radio = { version = "1.0.0-beta.1", features = ["wifi", "ble", "coex", "defmt", "unstable"] }
# panics and backtraces go to defmt/RTT like everything else
esp-backtrace = { version = "0.20", features = ["panic-handler", "defmt"] }
# internal-heap-stats: the high-water mark src/memory.rs logs (min free)
esp-alloc = { version = "0.11", features = ["internal-heap-stats"] }
esp-bootloader-esp-idf = { version = "0.6" }
trouble-host = { workspace = true, features = ["defmt"] }

#
# Persistent settings (src/storage.rs): esp-storage is the internal SPI
# flash as NorFlash, embassy-embedded-hal adapts it to the async traits
# sequential-storage's map wants, and the data lives in the `settings`
# partition of partitions.csv, found at boot from the partition table.
# esp-storage 0.10 is the one esp-bootloader-esp-idf 0.6 reads the table
# with, so they share one FlashStorage type. It is the repo's copy
# (vendor/esp-storage, root Cargo.toml [patch.crates-io]), whose flash-MMU
# API is public for src/xip.rs; it also writes the data slot.
#
esp-storage = { version = "0.10", features = ["embedded-storage"] }
# src/xip.rs: the cache invalidation after a data slot write runs with
# interrupts masked
critical-section = "1.2"
embassy-embedded-hal = "0.6"
sequential-storage = { version = "8.0", features = ["defmt"] }
embedded-storage = "0.3.2"
embedded-storage-async = "0.4"
embassy-sync = { workspace = true }

#
# Embassy
#
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-net = { workspace = true, features = [
    "tcp",
    "udp",
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
] }

#
# Networking
#
edge-nal = { workspace = true }
edge-nal-embassy = { workspace = true, features = ["proto-ipv4", "medium-ethernet", "tcp", "udp"] }
edge-dhcp = { workspace = true }
edge-captive = { workspace = true }

static_cell = { workspace = true }

# AtomicU64 (used by common) on riscv32imac needs emulation
portable-atomic = { workspace = true, features = ["critical-section"] }

# Choose's bundle, embedded in flash
extreme-packages = { path = "../extreme-packages" }

# feature `selftest` (src/selftest.rs)
extreme-protocol = { path = "../extreme-protocol", optional = true }
postcard = { workspace = true, optional = true }

[features]
default = ["esp32c6", "dev-race"]
# Drives the host from inside the firmware (Choose -> Race -> back, with
# synthetic GPS fixes, every 30 s) and logs what happens; for measuring on
# a box with no client and no GPS.
selftest = ["dep:extreme-protocol", "dep:postcard"]
# Temporary, until bundles are installed into their own partition: a bundle
# embedded in the image as the one app, from the path in the environment
# variable EXTREMERS_DEV_BUNDLE at build time (README.md).
dev-race = []
esp32c6 = [
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
    "esp-radio/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-alloc/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-storage/esp32c6",
]
