[package]
name = "tgt-pico"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
# Common crate for shared code
common = { path = "../common" }

embassy-executor = { workspace = true, features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
] }
embassy-time = { workspace = true }
embassy-net = { workspace = true, features = [
    "tcp",
    "udp",
    "medium-ethernet",
    "proto-ipv4",
] }

#
# Cortex
#
embassy-usb-logger = { version = "0.6" }
embassy-rp = { version = "0.10", features = [
    "rp2040",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
] }
cortex-m-rt = { version = "0.7" }
panic-probe = { version = "1.0" }
cyw43 = { version = "0.7" }
cyw43-pio = { version = "0.10" }

#
# Networking
#
edge-nal = { workspace = true }
edge-nal-embassy = { workspace = true, features = ["proto-ipv4", "medium-ethernet", "tcp", "udp"] }
edge-dhcp = { workspace = true }

#
# Other stuff
#
# AtomicU64 (used by common) on thumbv6m needs emulation
portable-atomic = { workspace = true, features = ["critical-section"] }
log = { workspace = true }
static_cell = { workspace = true }

#
# The magic
#
extreme-traits = { path = "../extreme-traits/" }
extreme-race = { path = "../extreme-race/" }
extreme-tune = { path = "../extreme-tune/" }
