[package]
name = "extreme-tune"
version = "0.1.0"
edition.workspace = true

# The `tune` package (extreme-packages/build.rs): its engine is this crate
# built as a cdylib for wasm32 (extreme_sdk::export_engine!), its Kindle
# page client-js/, its watch bundle watch-js/.
[lib]
crate-type = ["lib"]

[dependencies]
serde = { workspace = true }
postcard-schema = { workspace = true }
libm = { workspace = true }
heapless = { workspace = true }

extreme-sdk = { path = "../extreme-sdk" }

[dev-dependencies]
postcard = { workspace = true, features = ["use-std"] }
