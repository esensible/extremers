name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude xiaoc6 --exclude tgt-pico --exclude tgt-std
      - run: cargo build -p tgt-std --target x86_64-unknown-linux-gnu

  watch-js:
    name: Watch UI (solid-watch + engine bundles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # qjs: the QuickJS-ng version the watch app vendors
      - run: git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git "$RUNNER_TEMP/quickjs"
      - run: sh solid-watch/test/build-qjs.sh "$RUNNER_TEMP/quickjs" "$RUNNER_TEMP/qjs"
      # solid-watch: codegen check, test bundles under qjs and node, fixtures
      # unchanged, unit + type tests, import boundary (nothing outside solid-watch/)
      - run: npm ci
        working-directory: solid-watch
      - run: sh test/all.sh
        working-directory: solid-watch
        env:
          QJS: ${{ runner.temp }}/qjs
          CHECK_CLEAN: 1
      # extremers' fragment outputs are current
      - run: sh watch-js/codegen.sh --check
      # the generated wire bindings against the Rust encoder's golden
      # vectors, under node and QuickJS (that they are current is checked
      # by cargo test in the host job)
      - run: npm test
        working-directory: protocol-js
      - run: ${{ runner.temp }}/qjs test/qjs.mjs
        working-directory: protocol-js
      # the confirm widget the Kindle pages and the watch bundles share
      - run: npm test
        working-directory: client-common
      # the host envelope and per-package bindings (tools/watch-bindgen)
      - run: npm test
        working-directory: host-js
      - run: ${{ runner.temp }}/qjs test/qjs.mjs
        working-directory: host-js
      # each package's watch bundle: rebuild, regenerate its fixtures under
      # qjs, no diff, tests
      - name: watch bundles
        env:
          QJS: ${{ runner.temp }}/qjs
        run: |
          for d in extreme-race/watch-js extreme-tune/watch-js extreme-traits/watch-js; do
            (cd $d && npm ci && npm run build && npm run fixtures)
            git diff --exit-code -- $d/fixtures
            (cd $d && npm test)
          done

  firmware:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-C6 (tgt-xiaoc6)
            dir: tgt-xiaoc6
            target: riscv32imac-unknown-none-elf
          - name: Pico W (tgt-pico)
            dir: tgt-pico
            target: thumbv6m-none-eabi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
        working-directory: ${{ matrix.dir }}
