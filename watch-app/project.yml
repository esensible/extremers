# XcodeGen spec: `xcodegen generate` writes Extremers.xcodeproj (and the
# Info.plist and entitlements below). Edit this file, not the project.
name: Extremers
options:
  bundleIdPrefix: au.esensible
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    # Swift 5 language mode; builds with the Swift 5.9 and 6 compilers.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Your team ID (Xcode > Settings > Accounts), or pick the team in the
    # target's Signing & Capabilities tab after each `xcodegen generate`.
    DEVELOPMENT_TEAM: ""
packages:
  # The bundles' host: QuickJS-ng + Yoga + SwiftUI (solid-watch/README.md).
  SolidWatch:
    path: ../solid-watch
targets:
  Extremers:
    # A single-target, watch-only app (Xcode 14+ layout: no WatchKit
    # extension, no iOS companion). A shell: the box's link and its own
    # screens; each app is a package's solid-watch bundle.
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Extremers
      # the extremers schema fragment (palette), generated by watch-js/codegen.sh
      - path: ../watch-js/generated/ExtremersNodeProps.swift
      # the font the bundles are laid out in
      - path: ../solid-watch/fonts/Inter-roman.ttf
        buildPhase: resources
    dependencies:
      - package: SolidWatch
        product: SolidWatch
    preBuildScripts:
      # The package bundles, compiled in for now (Bundles/<package name>/):
      # each package's watch-js build, as committed in its fixtures (its
      # tests check fixtures/bundle.js is dist/watch.js) with its sha256.
      # Delivery over BLE replaces this later (BundleSource).
      - name: Copy package bundles
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/../extreme-race/watch-js/fixtures/bundle.js
          - $(SRCROOT)/../extreme-race/watch-js/fixtures/bundle.js.sha256
          - $(SRCROOT)/../extreme-tune/watch-js/fixtures/bundle.js
          - $(SRCROOT)/../extreme-tune/watch-js/fixtures/bundle.js.sha256
          - $(SRCROOT)/../extreme-traits/watch-js/fixtures/bundle.js
          - $(SRCROOT)/../extreme-traits/watch-js/fixtures/bundle.js.sha256
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Bundles/race/bundle.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Bundles/race/bundle.js.sha256
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Bundles/tune/bundle.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Bundles/tune/bundle.js.sha256
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Bundles/choose/bundle.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Bundles/choose/bundle.js.sha256
        script: |
          set -eu
          out="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Bundles"
          for p in race:extreme-race tune:extreme-tune choose:extreme-traits; do
            name=${p%%:*}
            src="$SRCROOT/../${p#*:}/watch-js/fixtures"
            mkdir -p "$out/$name"
            cp "$src/bundle.js" "$src/bundle.js.sha256" "$out/$name/"
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.esensible.extremers.watch
        PRODUCT_NAME: Extremers
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SKIP_INSTALL: "NO"
        ENABLE_PREVIEWS: "YES"
        GCC_WARN_INHIBIT_ALL_WARNINGS: "YES"
    info:
      path: Extremers/Info.plist
      properties:
        CFBundleDisplayName: Extremers
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A watchOS app built as one target, installed without an iPhone app.
        WKApplication: true
        WKWatchOnly: true
        NSBluetoothAlwaysUsageDescription: Extremers talks to the race computer on the boat over Bluetooth.
        NSHealthShareUsageDescription: Extremers runs a sailing workout so the watch keeps the race computer's countdown and haptics going with your wrist down.
        NSHealthUpdateUsageDescription: Extremers runs a sailing workout so the watch keeps the race computer's countdown and haptics going with your wrist down.
        # A running workout session keeps the app, and its Bluetooth link,
        # alive in the background.
        WKBackgroundModes:
          - workout-processing
    entitlements:
      path: Extremers/Extremers.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    scheme:
      testTargets:
        - ExtremersTests

  ExtremersTests:
    # Hostless: the pure-Swift model files are compiled into the bundle.
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ExtremersTests
      - path: Extremers/Model/Protocol.swift
      - path: Extremers/Model/Bundles.swift
      - path: Extremers/Model/Shell.swift
      - path: Extremers/Model/ShellLog.swift
      - path: ../watch-js/generated/ExtremersNodeProps.swift
      - path: Extremers/Model/LinkPolicy.swift
      - path: Extremers/Model/Security.swift
      - path: Extremers/Model/Box.swift
    dependencies:
      - package: SolidWatch
        product: SolidWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.esensible.extremers.watch.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
