[package]
name = "extreme-protocol"
version = "0.1.0"
edition.workspace = true
description = "The host protocol: the messages between the package host (the C6) and its clients, and the package manifest"

[dependencies]
serde = { workspace = true }
heapless = { workspace = true, features = ["serde"] }
postcard = { workspace = true }
postcard-schema = { workspace = true, features = ["heapless-v0_8"] }

[dev-dependencies]
postcard = { workspace = true, features = ["use-std"] }
