# XcodeGen spec for the solid-watch demo: a watch-only app that runs the
# fixture bundles, checks their mutation logs against the golden ones, and
# shows one of them live.  `xcodegen generate` writes SolidWatchDemo.xcodeproj.
name: SolidWatchDemo
options:
  bundleIdPrefix: au.esensible.solidwatch
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  SolidWatch:
    path: ../..
targets:
  SolidWatchDemo:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources
      - path: ../../fixtures
        type: folder
        buildPhase: resources
      - path: LocalFixtures
        type: folder
        buildPhase: resources
      - path: ../../fonts/Inter-roman.ttf
        buildPhase: resources
    dependencies:
      - package: SolidWatch
        product: SolidWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.esensible.solidwatch.demo
        PRODUCT_NAME: SolidWatchDemo
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SKIP_INSTALL: "NO"
        GCC_WARN_INHIBIT_ALL_WARNINGS: "YES"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: SolidWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
