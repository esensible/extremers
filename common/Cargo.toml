[package]
name = "common"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Embassy framework imports
embassy-futures = { workspace = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }

# Networking imports
edge-http = { workspace = true }
edge-ws = { workspace = true }
edge-nal = { workspace = true }
# BLE transport (feature `ble`); `security`: pairing, bonding, encryption.
# A pairing posts several connection events back to back (encrypted, pairing
# complete, plus whatever link updates the central asks for) while `serve`
# may be busy storing a bond; trouble drops what does not fit the queue
# (default 2), and a lost `PairingComplete` would be a lost bond.
trouble-host = { workspace = true, optional = true, features = ["security", "connection-event-queue-size-8"] }
# trouble-host's heapless (characteristic values); the engines use 0.8
heapless09 = { package = "heapless", version = "0.9", default-features = false, optional = true }
# `#[gatt_service]` names `static_cell::StaticCell` in the code it generates
static_cell = { workspace = true, optional = true }
embedded-io-async = { workspace = true }

# Other external crates
heapless = { workspace = true, features = ["serde"] }
# The wire format (src/protocol.rs)
serde = { workspace = true }
postcard = { workspace = true }
postcard-schema = { workspace = true, features = ["heapless-v0_8"] }
# Logging: `log` on the host, defmt on the firmware targets (src/fmt.rs).
log = { workspace = true }
defmt = { version = "1.0", optional = true }
# AtomicU64 on targets without 64-bit atomics (fallback is a no-op where they exist)
portable-atomic = { workspace = true, features = ["fallback"] }

# Local crates: the host protocol; bundles (the archive, its device tables,
# the install check); the VM the engines run on and the sailing builtins
# they link against; the bitwire codec views and events travel in. lang/,
# engine/, bundle/ and wire/ are workspaces of their own, depended on by path.
extreme-protocol = { path = "../extreme-protocol" }
bundle = { package = "extreme-bundle", path = "../bundle", default-features = false }
vm = { package = "lang-vm", path = "../lang/vm" }
sailing = { package = "engine-builtins", path = "../engine/builtins" }
bitwire = { path = "../wire/rust" }

[features]
default = []
std = ["edge-http/std", "edge-ws/std"]
# Log through defmt instead of `log` (the firmware targets).
defmt = ["dep:defmt"]
# The BLE GATT transport (src/ble.rs); needs a bt-hci controller from the target.
ble = ["dep:trouble-host", "dep:heapless09", "dep:static_cell"]

[dev-dependencies]
# generic-queue: the tests run timers without an embassy executor
embassy-time = { workspace = true, features = ["std", "generic-queue-8"] }
critical-section = { version = "1.2", features = ["std"] }
postcard = { workspace = true, features = ["use-std"] }
# the host tests run the real bundles: Choose (embedded) and Race
# (target/packages/race.bundle, `cargo run -p extreme-pack -- --bundle`);
# `std` packs variants of Race's archive
extreme-packages = { path = "../extreme-packages" }
bundle = { package = "extreme-bundle", path = "../bundle", features = ["std"] }
log = { workspace = true, features = ["std"] }
# views and events as JSON, through wire/rust's test adapter (host/tests.rs)
serde_json = { workspace = true }
