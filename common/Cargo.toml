[package]
name = "common"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Embassy framework imports
embassy-futures = { workspace = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }

# Networking imports
edge-http = { workspace = true }
edge-ws = { workspace = true }
edge-nal = { workspace = true }
# BLE transport (feature `ble`)
trouble-host = { workspace = true, optional = true }
# trouble-host's heapless (characteristic values); the engines use 0.8
heapless09 = { package = "heapless", version = "0.9", default-features = false, optional = true }
# `#[gatt_service]` names `static_cell::StaticCell` in the code it generates
static_cell = { workspace = true, optional = true }
embedded-io-async = { workspace = true }

# Other external crates
heapless = { workspace = true }
# Logging: `log` on the host, defmt on the firmware targets (src/fmt.rs).
log = { workspace = true }
defmt = { version = "1.0", optional = true }
# AtomicU64 on targets without 64-bit atomics (fallback is a no-op where they exist)
portable-atomic = { workspace = true, features = ["fallback"] }

# Local crates
extreme-traits = { path = "../extreme-traits" }

[features]
default = []
std = ["edge-http/std", "edge-ws/std"]
# Log through defmt instead of `log` (the firmware targets).
defmt = ["dep:defmt"]
# The BLE GATT transport (src/ble.rs); needs a bt-hci controller from the target.
ble = ["dep:trouble-host", "dep:heapless09", "dep:static_cell"]

[dev-dependencies]
# generic-queue: the tests run timers without an embassy executor
embassy-time = { workspace = true, features = ["std", "generic-queue-8"] }
critical-section = { version = "1.2", features = ["std"] }
