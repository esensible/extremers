[package]
name = "extreme-bindgen"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Generates the clients' JS bindings (protocol-js/) from the wire types' postcard schemas"

[[bin]]
name = "extreme-bindgen"
path = "src/main.rs"

[dependencies]
extreme-engines = { path = "../../extreme-engines" }
extreme-traits = { path = "../../extreme-traits" }
extreme-race = { path = "../../extreme-race" }
extreme-tune = { path = "../../extreme-tune" }
common = { path = "../../common" }
heapless = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
postcard-schema = { workspace = true, features = ["use-std"] }
