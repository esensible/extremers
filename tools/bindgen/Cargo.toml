[package]
name = "extreme-bindgen"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Generates the clients' JS and Swift bindings (protocol-js/, protocol-swift/, each package's protocol-js/) from the wire types' postcard schemas"

[[bin]]
name = "extreme-bindgen"
path = "src/main.rs"

[dependencies]
extreme-protocol = { path = "../../extreme-protocol" }
extreme-race = { path = "../../extreme-race" }
extreme-tune = { path = "../../extreme-tune" }
heapless = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
postcard-schema = { workspace = true, features = ["use-std"] }
# the synthetic firmware image's appended digest (vectors.rs)
sha2 = "0.10"
