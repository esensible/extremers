[package]
name = "extreme-pack"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Builds packages and their bundles: the compiled engine and its tables, the web and watch bundles, the manifest and its content hash"

[lib]
path = "src/lib.rs"

[[bin]]
name = "extreme-pack"
path = "src/main.rs"

[dependencies]
extreme-protocol = { path = "../../extreme-protocol" }
heapless = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
serde_json = { workspace = true }
# lang/ and engine/ are workspaces of their own (excluded from this one)
compiler = { package = "lang-compiler", path = "../../lang/compiler" }
engine-profile = { path = "../../engine/profile" }
# bundle/ is a workspace of its own for now, like wire/rust
bundle = { package = "extreme-bundle", path = "../../bundle", features = ["std"] }
