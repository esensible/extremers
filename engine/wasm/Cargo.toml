[package]
name = "engine-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "The studio's engine toolchain and host as WebAssembly (wasm-bindgen): the profile's interface, the compiler, sample runs, the device tables, the packer, and common::Host on a virtual clock."

[lib]
name = "engine_wasm"
path = "src/lib.rs"
# cdylib: the wasm module (wasm-bindgen); rlib: the native tests
crate-type = ["cdylib", "rlib"]

[dependencies]
compiler = { package = "lang-compiler", path = "../../lang/compiler" }
bytecode = { package = "lang-bytecode", path = "../../lang/bytecode" }
sailing = { package = "engine-builtins", path = "../builtins" }
engine-profile = { path = "../profile" }
bundle = { package = "extreme-bundle", path = "../../bundle", features = ["std"] }
extreme-protocol = { path = "../../extreme-protocol" }
extreme-pack = { path = "../../tools/package" }
common = { path = "../../common" }
# the VM's values: the engine's state leaves, read through common's host
vm = { package = "lang-vm", path = "../../lang/vm" }
postcard = { version = "1.1", features = ["use-std"] }
serde_json = "1"
base64 = "0.22"
# The host's clock (src/clock.rs is its embassy-time driver) and its
# futures, polled by hand (src/host.rs).
embassy-time = { version = "0.5", default-features = false }
embassy-time-driver = "0.2"
embassy-sync = { version = "0.8", default-features = false }
embassy-futures = "0.1.2"
# common's mutexes need a critical section: std's (a global lock; on
# wasm32-unknown-unknown there is one thread).
critical-section = { version = "1.2", features = ["std"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dev-dependencies]
# Race's views decoded and events encoded through wire/rust's JSON test
# adapter (tests/host.rs), as common's host tests do.
bitwire = { path = "../../wire/rust" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Its own workspace, like engine/builtins and engine/profile.
[workspace]
