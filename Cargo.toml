[workspace]
resolver = "3"

members = [
    # the host protocol, the old engine SDK, the host
    "extreme-protocol",
    "extreme-sdk",
    "common",

    # the old Rust engines (host-only now: bindgen and engine/race's
    # against_extreme_race), and what the firmware ships with (Choose)
    "extreme-race",
    "extreme-tune",
    "extreme-packages",

    # tools
    "tools/bindgen",
    "tools/package",
    "tools/image",

    # targets
    "tgt-std",
    "tgt-xiaoc6",
]
# wire/ is the stand-alone bitwire codec (its own workspace; to be open
# sourced). common depends on wire/rust by path, which would otherwise make
# it a member. lang/ and engine/ are workspaces of their own too: without
# the exclusion, a build that loads this workspace (e.g. through common)
# and also lang/vm attributes lang/vm to this workspace and fails on its
# inherited `license`. bundle/ (the bundle archive and device tables) is its
# own workspace for now too; common and tools/package depend on it by path.
# tgt-pico still runs the wasm3 host that is gone, and is left as it was
# (it doesn't build). vendor/ holds patched crates.io crates
# ([patch.crates-io]), built only for the targets that use them.
exclude = ["wire", "lang", "engine", "bundle", "tgt-pico", "vendor"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
#
# Embassy
#
embassy-executor = { version = "0.10", default-features = false }
embassy-net = { version = "0.9", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
embassy-time = { version = "0.5", default-features = false }
embassy-futures = "0.1.2"

#
# Embedded
#
embedded-io-async = { version = "0.7", default-features = false }

#
# Networking (the edge-net family, used directly rather than via the edge-net facade)
#
edge-http = { version = "0.8", default-features = false, features = ["io"] }
edge-ws = { version = "0.8", default-features = false, features = ["io"] }
edge-nal = { version = "0.7", default-features = false }
edge-nal-embassy = { version = "0.9", default-features = false }
edge-nal-std = { version = "0.7", default-features = false }
edge-dhcp = { version = "0.8", default-features = false, features = ["io"] }

#
# BLE (trouble-host 0.7 pairs with esp-radio 1.0.0-beta.1 via bt-hci 0.9).
# Patched to our fork below, see [patch.crates-io].
#
trouble-host = { version = "0.7", default-features = false, features = ["derive", "gatt", "peripheral", "default-packet-pool"] }
edge-captive = { version = "0.8", default-features = false, features = ["io"] }

#
# Other stuff
#
log = { version = "0.4", default-features = false }
heapless = { version = "0.8", default-features = false }
static_cell = { version = "2.1", default-features = false }
portable-atomic = { version = "1.15", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
# The wire format of engine state and client events, on the websocket and
# over BLE (README "Wire protocols"). postcard-schema's `Schema` derive is
# the source the JS bindings are generated from (tools/bindgen).
postcard = { version = "1.1", default-features = false }
postcard-schema = { version = "0.2.5", default-features = false, features = ["derive"] }
libm = "0.2"
paste = "1.0"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
# Debug info only lives in the ELF, not the flashed image; probe-rs needs it
# to show each defmt log line's source location.
debug = 2

# trouble-host: our fork, github.com/esensible/trouble branch
# bundle-ble-fixes, pinned by commit. It is embassy-rs/trouble main of
# 2026-07-30 (relabelled 0.7.0, bt-hci 0.9 like esp-radio 1.0.0-beta.1) plus
# fixes no release has (none are in 0.8.0): pairing with the on-air peer
# address, so Apple devices can re-pair (BLE.md "Security"); an LTK negative
# reply and a LongTermKeyMissing event for a bond we lost; the host runner
# surviving routine security events; the LESC keypair generated once;
# should_indicate reading the indicate bit; GATT caching (GattCaching); L2CAP
# wakers per connection and on channel close; peer_credits; and
# Stack::set_pairing_allowed (pairing refused outside the pairing window).
# `git log upstream/main..bundle-ble-fixes` in a clone lists them. To change
# trouble: commit and push to the fork, then move `rev` here (Cargo.lock
# follows). Drop this when a trouble-host release has those fixes.
[patch.crates-io]
trouble-host = { git = "https://github.com/esensible/trouble", rev = "d3430d3a5afd807d9afb0329ec81be83498ffe6d" }
trouble-host-macros = { git = "https://github.com/esensible/trouble", rev = "d3430d3a5afd807d9afb0329ec81be83498ffe6d" }
# esp-storage 0.10.0 with its flash-MMU mapping API public (vendor/esp-storage,
# src/mmu.rs says what changed), for the C6's execute-in-place reads of the
# data slot (tgt-xiaoc6/src/xip.rs). Vendored in the repo, so it builds
# anywhere the repo is. Drop it when an esp-storage release exposes that API.
esp-storage = { path = "vendor/esp-storage" }

# The esp-radio blobs require optimization to work correctly, even in debug builds
[profile.dev.package.esp-radio]
opt-level = 3
